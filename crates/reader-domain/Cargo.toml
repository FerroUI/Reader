[package]
name = "reader-domain"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
roxmltree = "0.20"
url = "2"

[dev-dependencies]
reader-domain = { path = ".", features = ["test-support"] }
