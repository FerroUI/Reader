[package]
name = "reader-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "reader-desktop"
path = "src/main.rs"
test = false

[dependencies]
reader-domain.workspace = true
reader-content = { workspace = true, features = ["extraction"] }
reader-state.workspace = true
reader-controls.workspace = true
reader-ui.workspace = true
reader-fonts = { path = "../reader-fonts", features = ["embedded"] }
ferroui-base.workspace = true
ferroui-controls.workspace = true
ferroui-desktop.workspace = true
ferroui-fonts-inter.workspace = true
serde_json.workspace = true
url.workspace = true
chrono = { workspace = true, features = ["clock"] }
